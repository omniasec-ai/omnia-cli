[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omnia-cli"
version = "0.2.0"
description = "Omnia CLI — terminal client for the Omnia API"
requires-python = ">=3.11"
dependencies = [
    "rich>=13",
    "httpx>=0.27",
    "pydantic>=2",
    "prompt_toolkit>=3.0",
    "python-dotenv>=1.0",
]

[project.scripts]
omnia = "omnia.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["omnia"]
