[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omnia-cli"
version = "0.2.0"
description = "Omnia CLI — terminal client for the Omnia API"
requires-python = ">=3.11"
dependencies = [
    "rich>=13",
    "prompt_toolkit>=3.0",
    "python-dotenv>=1.0",
    "omnia-sdk>=0.1.1",
]

[project.scripts]
omnia = "omnia.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["omnia"]

[tool.ruff]
line-length = 100
indent-width = 4

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.format]
indent-style = "space"
docstring-code-format = true
